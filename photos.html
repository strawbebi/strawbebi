<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Photos | Our Little Archive</title>

    <link rel="stylesheet" href="style.css">

</head>


<body
    class="page-photos"
    style="--photos-background: url('assets/backgrounds/photos-bg.jpg');"
>


<header class="app-header">

    <nav class="main-nav">

        <a
            class="nav-link"
            href="dashboard.html"
        >
            DASHBOARD
        </a>

        <a
            class="nav-link active"
            href="photos.html"
        >
            PHOTOS
        </a>

        <a
            class="nav-link"
            href="videos.html"
        >
            VIDEOS
        </a>

        <a
            class="nav-link"
            href="journal.html"
        >
            JOURNAL
        </a>

        <a
            class="nav-link"
            href="documents.html"
        >
            DOCUMENTS
        </a>

    </nav>


    <div class="user-menu">

        <div class="user-profile">

            <div class="avatar">

                <img
                    src="assets/avatar-placeholder.svg"
                    alt="Profile"
                >

            </div>


            <div class="user-info">

                <span class="user-greeting">

                    Hi,
                    <span data-user-name>
                        Name
                    </span>

                </span>


                <button
                    class="logout-link"
                    type="button"
                    onclick="signOut()"
                >
                    LOG OUT
                </button>

            </div>

        </div>

    </div>

</header>



<main class="page-wrap">


    <!-- TOOLBAR -->

    <div class="listing-toolbar">

        <button
            class="filter-pill"
            type="button"
        >
            ALL
        </button>


        <a
            class="matcha-btn"
            href="add-memory.html"
        >
            Upload
        </a>

    </div>



    <!-- PHOTO GRID -->

    <section
        class="photo-grid"
        id="photoGrid"
    >
    </section>



    <!-- EMPTY STATE -->

    <div
        id="emptyPhotos"
        class="empty-memory"
        hidden
    >

        <div class="empty-memory-icon">
            ♡
        </div>

        <h2>
            No memories yet
        </h2>

        <p>
            Upload your first photo together.
        </p>

    </div>



    <!-- LOAD MORE -->

    <div
        class="load-more"
        id="loadMoreContainer"
        hidden
    >

        <button
            class="primary-btn"
            id="loadMoreButton"
            type="button"
        >
            LOAD MORE
        </button>

    </div>


</main>



<!-- =========================================================
     PHOTO VIEWER MODAL
     ========================================================= -->

<div
    class="photo-modal"
    id="photoModal"
    hidden
>

    <div
        class="photo-modal-backdrop"
        id="photoModalBackdrop"
    ></div>

    <article
        class="photo-viewer"
        role="dialog"
        aria-modal="true"
        aria-labelledby="photoViewerTitle"
    >

        <button
            class="photo-close"
            id="photoClose"
            type="button"
            aria-label="Close photo viewer"
        >
            ×
        </button>

        <div class="photo-viewer-image-wrap">
            <img
                id="photoViewerImage"
                class="photo-viewer-image"
                src=""
                alt=""
            >
        </div>

        <div class="photo-viewer-info">

            <h2
                class="photo-viewer-title"
                id="photoViewerTitle"
            >
                Photo Title
            </h2>

            <p
                class="photo-viewer-date"
                id="photoViewerDate"
            >
                September 1, 2026
            </p>

            <p
                class="photo-viewer-uploader"
                id="photoViewerUploader"
            >
                Uploaded by Kayla
            </p>

            <a
                class="primary-btn photo-download-btn"
                id="photoDownloadButton"
                href="#"
                download
            >
                DOWNLOAD PHOTO
            </a>

        </div>

    </article>

</div>

<div
    id="toast"
    class="toast"
    role="status"
></div>



<!-- APP JS -->

<script src="js/app.js"></script>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase-config.js"></script>

<script src="js/auth.js"></script>



<script>

document.addEventListener(
    "DOMContentLoaded",
    async () => {

        await protectPage();

        loadPhotos();

    }
);



let currentPhotoPage = 0;

const PHOTOS_PER_PAGE = 12;



/* =========================================================
   LOAD PHOTOS
   ========================================================= */

async function loadPhotos() {

    const photoGrid =
        document.getElementById("photoGrid");

    const emptyPhotos =
        document.getElementById("emptyPhotos");

    const loadMoreContainer =
        document.getElementById("loadMoreContainer");


    try {

        const from =
            currentPhotoPage *
            PHOTOS_PER_PAGE;


        const to =
            from +
            PHOTOS_PER_PAGE -
            1;


        const {
            data: memories,
            error
        } =
            await supabaseClient
                .from("memories")
                .select("*")
                .eq("type", "photo")
                .order(
                    "memory_date",
                    {
                        ascending: false
                    }
                )
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                )
                .range(
                    from,
                    to
                );


        if (error) {

            console.error(
                "Could not load photos:",
                error
            );


            showToast(
                `Could not load photos: ${error.message}`
            );


            return;

        }



        /* =========================================
           NO PHOTOS
           ========================================= */

        if (
            currentPhotoPage === 0 &&
            (
                !memories ||
                memories.length === 0
            )
        ) {

            emptyPhotos.hidden =
                false;


            loadMoreContainer.hidden =
                true;


            return;

        }



        emptyPhotos.hidden =
            true;



        /* =========================================
           CREATE PHOTO CARDS
           ========================================= */

        for (
            const memory of memories
        ) {

            await createPhotoCard(
                memory,
                photoGrid
            );

        }



        /* =========================================
           LOAD MORE VISIBILITY
           ========================================= */

        if (
            memories.length <
            PHOTOS_PER_PAGE
        ) {

            loadMoreContainer.hidden =
                true;

        }
        else {

            loadMoreContainer.hidden =
                false;

        }



        currentPhotoPage++;


    }

    catch (error) {

        console.error(
            "Unexpected photo loading error:",
            error
        );


        showToast(
            "Something went wrong while loading your photos."
        );

    }

}



/* =========================================================
   CREATE PHOTO CARD
   ========================================================= */

async function createPhotoCard(
    memory,
    photoGrid
) {


    /* =========================================
       GET PRIVATE SIGNED URL
       ========================================= */

    const {
        data,
        error
    } =
        await supabaseClient
            .storage
            .from("memories")
            .createSignedUrl(
                memory.file_path,
                3600
            );


    if (error) {

        console.error(
            "Could not create photo URL:",
            error
        );


        return;

    }



    /* =========================================
       CREATE CARD
       ========================================= */

    const article =
        document.createElement(
            "article"
        );


    article.className =
        "photo-card";

    article.tabIndex = 0;

    article.setAttribute(
        "role",
        "button"
    );

    article.setAttribute(
        "aria-label",
        `View photo: ${memory.title}`
    );



    const image =
        document.createElement(
            "img"
        );


    image.src =
        data.signedUrl;


    image.alt =
        memory.title;



    const date =
        document.createElement(
            "span"
        );


    date.className =
        "photo-date";



    const formattedDate =
        new Date(
            `${memory.memory_date}T00:00:00`
        ).toLocaleDateString(
            "en-US",
            {
                month: "long",
                day: "numeric",
                year: "numeric"
            }
        );


    date.textContent =
        formattedDate;


    const uploader =
        document.createElement("span");

    uploader.className =
        "photo-uploader";

    uploader.textContent =
        `Uploaded by ${memory.uploaded_by || "Unknown"}`;


    article.appendChild(
        image
    );


    article.appendChild(
        date
    );


    article.appendChild(
        uploader
    );


    photoGrid.appendChild(
        article
    );


    /* =========================================
       OPEN PHOTO VIEWER
       ========================================= */

    article.addEventListener(
        "click",
        () => {

            openPhoto(
                memory,
                data.signedUrl
            );

        }
    );


    article.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter" ||
                event.key === " "
            ) {

                event.preventDefault();

                openPhoto(
                    memory,
                    data.signedUrl
                );

            }

        }
    );

}



/* =========================================================
   OPEN PHOTO VIEWER
   ========================================================= */

function openPhoto(
    memory,
    signedUrl
) {

    const modal =
        document.getElementById(
            "photoModal"
        );

    const viewerImage =
        document.getElementById(
            "photoViewerImage"
        );

    const viewerTitle =
        document.getElementById(
            "photoViewerTitle"
        );

    const viewerDate =
        document.getElementById(
            "photoViewerDate"
        );

    const viewerUploader =
        document.getElementById(
            "photoViewerUploader"
        );

    const downloadButton =
        document.getElementById(
            "photoDownloadButton"
        );

    const formattedDate =
        new Date(
            `${memory.memory_date}T00:00:00`
        ).toLocaleDateString(
            "en-US",
            {
                month: "long",
                day: "numeric",
                year: "numeric"
            }
        );


    viewerImage.src = signedUrl;
    viewerImage.alt = memory.title || "Photo";
    viewerTitle.textContent = memory.title || "Untitled photo";
    viewerDate.textContent = formattedDate;
    viewerUploader.textContent =
        `Uploaded by ${memory.uploaded_by || "Unknown"}`;


    downloadButton.onclick = async event => {

        event.preventDefault();

        const originalText =
            downloadButton.textContent;

        downloadButton.textContent =
            "PREPARING DOWNLOAD...";

        downloadButton.style.pointerEvents =
            "none";

        try {

            const {
                data: fileData,
                error
            } =
                await supabaseClient
                    .storage
                    .from("memories")
                    .download(
                        memory.file_path
                    );


            if (error) {
                throw error;
            }


            const blobUrl =
                URL.createObjectURL(
                    fileData
                );

            const link =
                document.createElement("a");

            link.href = blobUrl;
            link.download =
                memory.file_name ||
                "our-little-archive-photo";

            document.body.appendChild(link);
            link.click();
            link.remove();

            setTimeout(
                () => URL.revokeObjectURL(blobUrl),
                1000
            );

        }
        catch (error) {

            console.error(
                "Could not download photo:",
                error
            );

            showToast(
                `Could not download photo: ${error.message}`
            );

        }
        finally {

            downloadButton.textContent =
                originalText;

            downloadButton.style.pointerEvents =
                "";

        }

    };


    modal.hidden = false;

    document.body.classList.add(
        "photo-modal-open"
    );

    document
        .getElementById(
            "photoClose"
        )
        .focus();

}


/* =========================================================
   CLOSE PHOTO VIEWER
   ========================================================= */

function closePhoto() {

    const modal =
        document.getElementById(
            "photoModal"
        );

    modal.hidden = true;

    document.body.classList.remove(
        "photo-modal-open"
    );

    const viewerImage =
        document.getElementById(
            "photoViewerImage"
        );

    viewerImage.src = "";

}


document
    .getElementById(
        "photoClose"
    )
    ?.addEventListener(
        "click",
        closePhoto
    );


document
    .getElementById(
        "photoModalBackdrop"
    )
    ?.addEventListener(
        "click",
        closePhoto
    );

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape" &&
            !document.getElementById(
                "photoModal"
            ).hidden
        ) {

            closePhoto();

        }

    }
);


/* =========================================================
   LOAD MORE
   ========================================================= */

document
    .getElementById(
        "loadMoreButton"
    )
    ?.addEventListener(
        "click",
        loadPhotos
    );

</script>

</body>

</html>
