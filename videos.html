<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Videos | Our Little Archive</title>

    <link rel="stylesheet" href="style.css">

</head>


<body
    class="page-videos"
    style="--videos-background: url('assets/backgrounds/videos-bg.jpg');"
>


<!-- =========================================================
     HEADER
     ========================================================= -->

<header class="app-header">

    <nav class="main-nav">

        <a
            class="nav-link"
            href="dashboard.html"
        >
            DASHBOARD
        </a>

        <a
            class="nav-link"
            href="photos.html"
        >
            PHOTOS
        </a>

        <a
            class="nav-link active"
            href="videos.html"
        >
            VIDEOS
        </a>

        <a
            class="nav-link"
            href="journal.html"
        >
            JOURNAL
        </a>

        <a
            class="nav-link"
            href="documents.html"
        >
            DOCUMENTS
        </a>

    </nav>


    <div class="user-menu">

        <div class="user-profile">

            <div class="avatar">

                <img
                    src="assets/avatar-placeholder.svg"
                    alt="Profile"
                >

            </div>


            <div class="user-info">

                <span class="user-greeting">

                    Hi,
                    <span data-user-name>
                        Name
                    </span>

                </span>


                <button
                    class="logout-link"
                    type="button"
                    onclick="signOut()"
                >
                    LOG OUT
                </button>

            </div>

        </div>

    </div>

</header>



<!-- =========================================================
     MAIN
     ========================================================= -->

<main class="page-wrap">


    <!-- TOOLBAR -->

    <div class="listing-toolbar">

        <button
            class="filter-pill"
            type="button"
        >
            ALL
        </button>


        <a
            class="matcha-btn"
            href="add-memory.html"
        >
            Upload
        </a>

    </div>



    <!-- =====================================================
         VIDEO GALLERY
         ===================================================== -->

    <section
        class="video-grid"
        id="videoGrid"
    >
    </section>



    <!-- =====================================================
         EMPTY STATE
         ===================================================== -->

    <div
        id="emptyVideos"
        class="empty-memory"
        hidden
    >

        <div class="empty-memory-icon">
            ♡
        </div>

        <h2>
            No videos yet
        </h2>

        <p>
            Upload your first video together.
        </p>

    </div>



    <!-- =====================================================
         LOAD MORE
         ===================================================== -->

    <div
        class="load-more"
        id="loadMoreContainer"
        hidden
    >

        <button
            class="primary-btn"
            id="loadMoreButton"
            type="button"
        >
            LOAD MORE
        </button>

    </div>


</main>



<!-- =========================================================
     TOAST
     ========================================================= -->

<div
    id="toast"
    class="toast"
    role="status"
></div>



<!-- =========================================================
     JAVASCRIPT
     ========================================================= -->

<script src="js/app.js"></script>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase-config.js"></script>

<script src="js/auth.js"></script>



<script>

/* =========================================================
   INITIALIZE
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    async () => {

        await protectPage();

        loadVideos();

    }
);



/* =========================================================
   PAGINATION
   ========================================================= */

let currentVideoPage = 0;

const VIDEOS_PER_PAGE = 6;



/* =========================================================
   LOAD VIDEOS
   ========================================================= */

async function loadVideos() {

    const videoGrid =
        document.getElementById("videoGrid");

    const emptyVideos =
        document.getElementById("emptyVideos");

    const loadMoreContainer =
        document.getElementById("loadMoreContainer");


    try {

        const from =
            currentVideoPage *
            VIDEOS_PER_PAGE;


        const to =
            from +
            VIDEOS_PER_PAGE -
            1;



        /* =========================================
           GET VIDEO MEMORIES
           ========================================= */

        const {
            data: memories,
            error
        } =
            await supabaseClient
                .from("memories")
                .select("*")
                .eq("type", "video")
                .order(
                    "memory_date",
                    {
                        ascending: false
                    }
                )
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                )
                .range(
                    from,
                    to
                );



        /* =========================================
           DATABASE ERROR
           ========================================= */

        if (error) {

            console.error(
                "Could not load videos:",
                error
            );


            showToast(
                `Could not load videos: ${error.message}`
            );


            return;

        }



        /* =========================================
           EMPTY STATE
           ========================================= */

        if (
            currentVideoPage === 0 &&
            (
                !memories ||
                memories.length === 0
            )
        ) {

            emptyVideos.hidden =
                false;


            loadMoreContainer.hidden =
                true;


            return;

        }



        emptyVideos.hidden =
            true;



        /* =========================================
           CREATE VIDEO CARDS
           ========================================= */

        for (
            const memory of memories
        ) {

            await createVideoCard(
                memory,
                videoGrid
            );

        }



        /* =========================================
           LOAD MORE BUTTON
           ========================================= */

        if (
            memories.length <
            VIDEOS_PER_PAGE
        ) {

            loadMoreContainer.hidden =
                true;

        }
        else {

            loadMoreContainer.hidden =
                false;

        }



        currentVideoPage++;


    }

    catch (error) {

        console.error(
            "Unexpected video loading error:",
            error
        );


        showToast(
            "Something went wrong while loading your videos."
        );

    }

}



/* =========================================================
   CREATE VIDEO CARD
   ========================================================= */

async function createVideoCard(
    memory,
    videoGrid
) {


    /* =========================================
       GET PRIVATE SIGNED URL
       ========================================= */

    const {
        data,
        error
    } =
        await supabaseClient
            .storage
            .from("memories")
            .createSignedUrl(
                memory.file_path,
                3600
            );


    if (error) {

        console.error(
            "Could not create video URL:",
            error
        );


        return;

    }



    /* =========================================
       CREATE CARD
       ========================================= */

    const article =
        document.createElement(
            "article"
        );


    article.className =
        "video-card";



    /* =========================================
       VIDEO THUMBNAIL
       ========================================= */

    const videoThumb =
        document.createElement(
            "div"
        );


    videoThumb.className =
        "video-thumb";



    const video =
        document.createElement(
            "video"
        );


    video.src =
        data.signedUrl;


    video.preload =
        "metadata";


    video.playsInline =
        true;


    video.muted =
        true;



    /* =========================================
       PLAY BUTTON
       ========================================= */

    const playButton =
        document.createElement(
            "span"
        );


    playButton.className =
        "play";


    playButton.textContent =
        "▶";



    /* =========================================
       CLICK PLAY BUTTON
       ========================================= */

    playButton.addEventListener(
        "click",
        async (event) => {

            event.stopPropagation();


            try {

                video.controls =
                    true;


                await video.play();


                playButton.style.display =
                    "none";

            }

            catch (error) {

                console.error(
                    "Could not play video:",
                    error
                );

            }

        }
    );



    /* =========================================
       VIDEO CLICK
       ========================================= */

    video.addEventListener(
        "play",
        () => {

            playButton.style.display =
                "none";

        }
    );


    video.addEventListener(
        "pause",
        () => {

            playButton.style.display =
                "grid";

        }
    );



    videoThumb.appendChild(
        video
    );


    videoThumb.appendChild(
        playButton
    );



    /* =========================================
       VIDEO INFORMATION
       ========================================= */

    const videoInfo =
        document.createElement(
            "div"
        );


    videoInfo.className =
        "video-info";



    const title =
        document.createElement(
            "h3"
        );


    title.textContent =
        memory.title;



    const date =
        document.createElement(
            "p"
        );


    date.className =
        "video-date";


    const uploader =
        document.createElement(
            "p"
        );


    uploader.className =
        "video-uploader";


    const formattedDate =
        new Date(
            `${memory.memory_date}T00:00:00`
        ).toLocaleDateString(
            "en-US",
            {
                month: "long",
                day: "numeric",
                year: "numeric"
            }
        );


    date.textContent =
        formattedDate;


    uploader.textContent =
        `Uploaded by ${memory.uploaded_by || "Unknown"}`;


    videoInfo.appendChild(
        title
    );


    videoInfo.appendChild(
        date
    );


    videoInfo.appendChild(
        uploader
    );



    /* =========================================
       PUT EVERYTHING TOGETHER
       ========================================= */

    article.appendChild(
        videoThumb
    );


    article.appendChild(
        videoInfo
    );


    videoGrid.appendChild(
        article
    );

}



/* =========================================================
   LOAD MORE BUTTON
   ========================================================= */

document
    .getElementById(
        "loadMoreButton"
    )
    ?.addEventListener(
        "click",
        loadVideos
    );

</script>

</body>

</html>
